<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#766fa7'><link rel='manifest' href='manifest.webmanifest'><title>Aiwei❤️ 心情日記</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#eee9f7;color:#333}.app{max-width:430px;margin:auto;min-height:100vh;background:linear-gradient(#7379a8aa,#e7c4dfcc),url('background.jpeg') center/cover fixed;position:relative;padding:env(safe-area-inset-top) 16px calc(86px + env(safe-area-inset-bottom))}.glass{background:#fffffff0;border:1px solid #ffffffaa;box-shadow:0 12px 35px #3d31552a;border-radius:26px}.hero{text-align:center;color:white;padding:34px 12px 18px}.hero h1{font-size:46px;margin:0;letter-spacing:3px}.hero p{line-height:1.7}.pearl{width:150px;height:150px;margin:10px auto;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0 50%,#e9e4ef 51% 70%,#c6bddd 71%);display:grid;place-items:center;font-size:64px;box-shadow:0 15px 35px #382d5b44}.card{padding:20px;margin:12px 0}.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.mood{border:0;background:#f5eff8;border-radius:18px;padding:12px 4px;font-size:26px}.mood span{display:block;font-size:11px;margin-top:5px}.mood.active{outline:3px solid #d66ab6;background:#fff}.btn{width:100%;border:0;border-radius:22px;padding:15px;background:linear-gradient(90deg,#d66ab6,#a66ad0);color:white;font-weight:700;font-size:16px}.input{width:100%;border:0;background:#f7f4fa;border-radius:18px;padding:14px;margin:8px 0;min-height:110px;font:inherit}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tag{border:0;border-radius:16px;padding:9px 12px;background:#f0ebf5}.tag.active{background:#ead2e8;color:#9b3f86}.hidden{display:none}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffefef2;padding:10px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.nav button{border:0;background:none;font-size:12px}.nav b{display:block;font-size:21px;margin-bottom:2px}.nav .on{color:#d255a5}.month{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#f3eff6;font-size:13px}.chart{display:flex;align-items:flex-end;height:150px;gap:10px;padding-top:15px}.bar{flex:1;background:linear-gradient(#d967b6,#7f79b8);border-radius:12px 12px 5px 5px;min-height:12px}.small{font-size:13px;color:#746d7b;line-height:1.6}h2{margin:0 0 8px}.sectionTitle{color:white;text-align:center;margin:22px 0 8px}.letter{min-height:180px}.quote{text-align:center;color:white;font-size:17px;line-height:1.8;padding:18px}.row{display:flex;gap:8px}.row>*{flex:1}.toolbar{display:flex;gap:8px;margin:8px 0 14px}.tool{border:0;border-radius:16px;padding:10px 12px;background:#f3edf7}.stickerTray{display:none;background:#fff8;border-radius:20px;padding:12px;margin:8px 0}.stickerTray.show{display:block}.stickerCats{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.stickerGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sticker{border:0;background:#fff;border-radius:16px;padding:8px;font-size:28px;box-shadow:0 3px 10px #5d4a6a18}.stickerCanvas{min-height:76px;background:#faf7fc;border:1px dashed #dbcde5;border-radius:18px;padding:10px;margin:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}.placed{font-size:34px;cursor:pointer;user-select:none}.hint{font-size:11px;color:#95899b}
</style></head><body><main class='app'>
<section id='today'><div class='hero'><h1>Aiwei❤️</h1><p>心情日記<br>每一種心情，都值得被記錄。</p><div class='pearl'>🙂</div></div><div class='glass card'><h2>今天，過得怎麼樣？</h2><p class='small'>選一個最接近現在的心情吧。</p><div class='moods' id='moods'></div><button class='btn' onclick="go('write')">開始今天的日記 →</button></div><div class='quote'>給自己一點時間 ♡</div></section>
<section id='write' class='hidden'><h2 class='sectionTitle'>寫下今天的心情</h2><div class='glass card'><div class='small' id='date'></div><textarea id='note' class='input' placeholder='今天發生了什麼？想記下的、想說的、想放下的…都可以寫在這裡。'></textarea><div class='toolbar'><button class='tool' onclick='toggleStickers()'>🧸 貼紙</button><span class='hint'>點貼紙加入；點已貼上的貼紙可移除</span></div><div id='stickerTray' class='stickerTray'><div class='stickerCats' id='stickerCats'></div><div class='stickerGrid' id='stickerGrid'></div></div><div id='stickerCanvas' class='stickerCanvas'><span class='hint'>今天想貼什麼心情？</span></div><b>這次的主題是？</b><div class='tags' id='tags'></div><textarea id='gratitude' class='input' style='min-height:75px' placeholder='今天值得感謝的小事？'></textarea><button class='btn' onclick='saveEntry()'>保存日記</button></div></section>
<section id='diary' class='hidden'><h2 class='sectionTitle'>心情月曆</h2><div class='glass card'><h2 id='monthTitle'></h2><div class='month' id='calendar'></div></div><div id='entries'></div></section>
<section id='trend' class='hidden'><h2 class='sectionTitle'>心情趨勢</h2><div class='glass card'><div class='row'><button class='tag active'>7 天</button><button class='tag'>30 天</button><button class='tag'>全部</button></div><div class='chart' id='chart'></div><p class='small' id='trendText'></p></div><div class='glass card'><h2>給未來的自己</h2><textarea id='future' class='input letter' placeholder='寫一段話，留給未來某一天的自己…'></textarea><div class='row'><button class='tag' onclick='saveFuture(7)'>7 天後</button><button class='tag' onclick='saveFuture(30)'>30 天後</button></div></div></section>
</main><nav class='nav'><button class='on' onclick="go('today',this)"><b>⌂</b>今天</button><button onclick="go('diary',this)"><b>▤</b>日記</button><button onclick="go('trend',this)"><b>▥</b>趨勢</button><button onclick="go('write',this)"><b>♡</b>記一筆</button></nav>
<script>
const stickerSets={心情:['🥰','🥹','😴','😵‍💫','😭','😤','🤍','💗','✨','🌈'],可愛:['🐱','🐻','🐰','🐶','🐣','🦦','🧸','🎀','🍓','🍰'],日常:['☕️','📷','🎧','📚','🛁','🌙','☀️','🌧️','🌿','🌸'],文字:['💪','辛苦了♡','今天也很棒♡','慢慢來','抱抱♡']};let stickerCat='心情',selectedStickers=[];
const moodData=[['😄','很好',5],['🙂','不錯',4],['😐','普通',3],['😔','有點累',2],['😣','很不好',1]],tagData=['💼 工作','💗 感情','🏠 家庭','👥 朋友','🧍 自己','🌿 身體','😠 憤怒','••• 其他'];let selectedMood=3,selectedTags=[];
function qs(s){return document.querySelector(s)}function all(s){return [...document.querySelectorAll(s)]}function renderMoods(){qs('#moods').innerHTML=moodData.map((m,i)=>`<button class='mood ${m[2]==selectedMood?'active':''}' onclick='selectedMood=${m[2]};renderMoods()'>${m[0]}<span>${m[1]}</span></button>`).join('')}function renderTags(){qs('#tags').innerHTML=tagData.map(t=>`<button class='tag ${selectedTags.includes(t)?'active':''}' onclick='toggleTag(${JSON.stringify(t)})'>${t}</button>`).join('')}function toggleTag(t){selectedTags=selectedTags.includes(t)?selectedTags.filter(x=>x!==t):[...selectedTags,t];renderTags()}
function toggleStickers(){qs('#stickerTray').classList.toggle('show');renderStickers()}function renderStickers(){qs('#stickerCats').innerHTML=Object.keys(stickerSets).map(c=>`<button class='tag ${c===stickerCat?'active':''}' onclick="stickerCat='${c}';renderStickers()">${c}</button>`).join('');qs('#stickerGrid').innerHTML=stickerSets[stickerCat].map(st=>`<button class='sticker' onclick='addSticker(${JSON.stringify(st)})'>${st}</button>`).join('');renderStickerCanvas()}function addSticker(st){selectedStickers.push(st);renderStickerCanvas()}function removeSticker(i){selectedStickers.splice(i,1);renderStickerCanvas()}function renderStickerCanvas(){qs('#stickerCanvas').innerHTML=selectedStickers.length?selectedStickers.map((st,i)=>`<span class='placed' onclick='removeSticker(${i})'>${st}</span>`).join(''):`<span class='hint'>今天想貼什麼心情？</span>`}
function go(id,btn){['today','write','diary','trend'].forEach(x=>qs('#'+x).classList.toggle('hidden',x!==id));all('.nav button').forEach(x=>x.classList.remove('on'));if(btn)btn.classList.add('on');if(id==='diary')renderDiary();if(id==='trend')renderTrend();scrollTo(0,0)}
function key(){return 'moodEntries'}function entries(){return JSON.parse(localStorage.getItem(key())||'[]')}function saveEntry(){let e=entries();e.unshift({date:new Date().toISOString(),mood:selectedMood,note:qs('#note').value,tags:selectedTags,gratitude:qs('#gratitude').value,stickers:selectedStickers});localStorage.setItem(key(),JSON.stringify(e));qs('#note').value='';qs('#gratitude').value='';selectedTags=[];selectedStickers=[];renderTags();renderStickerCanvas();alert('今天的心情，已經好好收下 ♡');go('diary')}
function renderDiary(){let now=new Date(),y=now.getFullYear(),m=now.getMonth();qs('#monthTitle').textContent=`${y}年${m+1}月`;let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),e=entries();let cells=Array(first).fill('<div></div>');for(let d=1;d<=days;d++){let found=e.find(x=>{let z=new Date(x.date);return z.getFullYear()==y&&z.getMonth()==m&&z.getDate()==d});let icon=found?moodData.find(x=>x[2]==found.mood)[0]:d;cells.push(`<div class='day'>${icon}</div>`)}qs('#calendar').innerHTML=cells.join('');qs('#entries').innerHTML=e.slice(0,6).map(x=>{let md=moodData.find(a=>a[2]==x.mood);return `<div class='glass card'><b>${md[0]} ${md[1]}</b><div class='small'>${new Date(x.date).toLocaleDateString('zh-TW')} · ${x.tags.join(' ')}</div><p>${x.note||'今天沒有留下文字。'}</p>${(x.stickers||[]).length?`<div style='font-size:28px'>${x.stickers.join(' ')}</div>`:''}</div>`}).join('')}
function renderTrend(){let e=entries().slice(0,7).reverse();qs('#chart').innerHTML=e.length?e.map(x=>`<div class='bar' style='height:${x.mood*20}%'></div>`).join(''):`<p class='small'>再記幾天，就能看到自己的心情起伏囉。</p>`;if(e.length){let avg=e.reduce((a,b)=>a+b.mood,0)/e.length;qs('#trendText').textContent=avg>=4?'最近的你，整體狀態很不錯 ♡':avg>=3?'生活有起伏，但你一直有在往前走。':'最近似乎比較辛苦，記得也替自己留一些空間。'}}function saveFuture(days){let txt=qs('#future').value;if(!txt)return alert('先寫一句話給未來的自己吧');localStorage.setItem('futureLetter',JSON.stringify({txt,open:Date.now()+days*86400000}));alert(`已經替你收好，${days} 天後再見 ♡`);qs('#future').value=''}
qs('#date').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});renderMoods();renderTags();renderStickers();renderStickerCanvas();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
